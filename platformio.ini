[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DOLED_SDA=21
    -DOLED_SCL=22
    -DCORE_DEBUG_LEVEL=0

; Published image: placeholder WiFi + PAIR-ME token, never real credentials.
[env:esp32dev-release]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DDSH_RELEASE_BUILD=1
